name: Windows Installer

on:
  push:
    branches:
      - main
      - main-ci-test
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Qt 6.9 & Windows
    runs-on: windows-2025

    env:
      QT_VERSION: 6.9.0
      # mingw for QT
#      QT_MINGW: mingw1310_64
      BUILD_DIR: r2s_build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_mingw

      - name: Add MinGW to PATH
        run: |
          echo "C:\Qt\${{ env.QT_VERSION }}\mingw_64\bin" >> $GITHUB_PATH
#          echo "C:\Qt\Tools\${{ env.QT_MINGW }}\bin" >> $GITHUB_PATH

      - name: Show compiler and Qt tools in PATH (debug)
        run: |
          where g++
          where qmake
          where mingw32-make
          where cmake
          echo $PATH

      - name: Clean build directory
        run: |
          if exist ${{ env.BUILD_DIR }} rmdir /s /q ${{ env.BUILD_DIR }}

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Install 7-Zip
        run: choco install 7zip -y

      - name: Create build directory
        run: cmake -E make_directory ${{ env.BUILD_DIR }}

      - name: Configure CMake
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="C:/Qt/${{ env.QT_VERSION }}/mingw_64"

      - name: Build
        run: |
          cmake --build ${{ env.BUILD_DIR }} --config Release

      - name: Install
        run: cmake --install ${{ env.BUILD_DIR }}
        shell: bash

      - name: Package build output as 7z
        run: |
          7z a build-output.7z .\${{ env.BUILD_DIR }}\*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: roc2rawsplits.7z
          path: build-output.7z