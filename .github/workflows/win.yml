name: Build Windows

on:
  push:
    branches: [ main, mian-ci-test2 ]
  pull_request:
    branches: [ main, mian-ci-test2 ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Install MinGW
        uses: egor-tensin/setup-mingw@v3
        with:
          platform: x64
      
      - name: Install CMake
        uses: ssrobins/install-cmake@v1
      
      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          target: 'desktop'
          arch: 'win64_mingw_64'
          install-deps: 'true'
          cache: 'true'
      
      - name: Create build directory
        run: mkdir -p build
        shell: bash
          
      - name: Configure CMake with MinGW
        run: |
          cd build
          cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20
      
      - name: Build application
        run: |
          cd build
          cmake --build . --config Release --parallel
      
      - name: Collect dependencies
        shell: bash
        run: |
          buildDir="build/Release"
          depsDir="deps"
          mkdir -p $depsDir
          
          # Copy main executable
          if [ -f "build/roc2rawsplits.exe" ]; then
            cp build/roc2rawsplits.exe $depsDir/
          else
            cp build/Release/roc2rawsplits.exe $depsDir/
          fi
          
          # Get Qt DLLs using windeployqt
          qtPath="${{ env.Qt6_DIR }}"
          windeployqt="$qtPath/../../../bin/windeployqt.exe"
          
          if [ -f "$windeployqt" ]; then
            "$windeployqt" --release "$depsDir/roc2rawsplits.exe"
          else
            echo "Warning: windeployqt not found at expected location"
            # Fallback: manually copy Qt DLLs
            qtBin="$qtPath/bin"
            if [ -d "$qtBin" ]; then
              find "$qtBin" -name "Qt6*.dll" -exec cp {} $depsDir \;
              find "$qtBin" -name "libcrypto*.dll" -exec cp {} $depsDir \; 2>/dev/null || true
              find "$qtBin" -name "libssl*.dll" -exec cp {} $depsDir \; 2>/dev/null || true
            fi
          fi
          
          # Copy MinGW runtime libraries
          mingwPath=$(which g++ | xargs dirname)
          echo "MinGW bin path: $mingwPath"
          
          # Copy essential MinGW DLLs
          if [ -d "$mingwPath" ]; then
            cp "$mingwPath/libgcc_s_seh-1.dll" $depsDir/ 2>/dev/null || true
            cp "$mingwPath/libstdc++-6.dll" $depsDir/ 2>/dev/null || true
            cp "$mingwPath/libwinpthread-1.dll" $depsDir/ 2>/dev/null || true
          fi
      
      - name: Create 7z archive
        shell: bash
        run: |
          cd deps
          7z a -r ../roc2rawsplits-windows-mingw-release.7z *
          cd ..
          ls -lh roc2rawsplits-windows-mingw-release.7z
      
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: roc2rawsplits-windows-mingw-release
          path: roc2rawsplits-windows-mingw-release.7z

